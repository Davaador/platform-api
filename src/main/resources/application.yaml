spring:
  application:
    name: platform-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only checks it
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: english-platform
    access-token-ttl: 15m
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  refresh-token:
    ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
